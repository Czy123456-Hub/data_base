name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create runtime config
        env:
          SUPABASE_URL_RAW: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_RAW: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${SUPABASE_URL_RAW#*=}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY_RAW#*=}"
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          cat > config.js <<'EOF'
          window.SUPABASE_CONFIG = {
            url: "__SUPABASE_URL__",
            anonKey: "__SUPABASE_ANON_KEY__"
          };
          EOF
          sed -i "s#__SUPABASE_URL__#$SUPABASE_URL#g" config.js
          sed -i "s#__SUPABASE_ANON_KEY__#$SUPABASE_ANON_KEY#g" config.js

      - name: Prepare site artifact
        run: |
          mkdir -p dist
          cp index.html config.js .nojekyll dist/
          cp -R assets dist/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
